<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow Team</title>
    <link href="../assets/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
    <link href="css/app.css" rel="stylesheet">
</head>
<body class="taskflow-page">
    <div class="container py-3 py-md-5">
        <div id="app-navbar"></div>
        <header class="mb-4">
            <h1 class="h2 fw-bold mb-1">Team Members</h1>
            <div id="status" class="small text-secondary mt-2">Loading team data...</div>
        </header>

        <main>
            <section id="team" class="card border-0 shadow-sm mb-4">
                <div class="card-body p-3 p-md-5">
                    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-4">
                        <div>
                            <p class="text-muted mb-0">List of currently active team members</p>
                        </div>
                        <div class="d-flex align-items-center gap-2">
                            <span id="online-badge" class="badge bg-success-subtle text-success-emphasis px-3 py-2 rounded-pill">0 online</span>
                            <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#member-modal">+ Add Member</button>
                        </div>
                    </div>

                    <div class="table-responsive-desktop">
                        <table class="table table-hover align-middle table-stack mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th scope="col">Name</th>
                                    <th scope="col">NIM</th>
                                    <th scope="col">Role</th>
                                    <th scope="col">Status</th>
                                    <th scope="col">Tasks</th>
                                    <th scope="col" class="text-end">Action</th>
                                </tr>
                            </thead>
                            <tbody id="team-table-body"></tbody>
                        </table>
                    </div>
                </div>
            </section>

            <section class="card border-0 shadow-sm">
                <div class="card-body p-3 p-md-5">
                    <p class="mb-0 text-secondary">Data loaded from SQLite and persisted in IndexedDB.</p>
                </div>
            </section>
        </main>

        <div class="modal fade" id="member-modal" tabindex="-1" aria-labelledby="member-modal-label" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered modal-fullscreen-sm-down">
                <div class="modal-content">
                    <div class="modal-header">
                        <h2 class="modal-title h5" id="member-modal-label">Add Team Member</h2>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                    <form class="row g-3" id="form-register">
                        <div class="col-md-6">
                            <label for="name" class="form-label">Name</label>
                            <input id="name" name="name" type="text" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label for="nim" class="form-label">NIM</label>
                            <input id="nim" name="nim" type="text" inputmode="numeric" class="form-control">
                        </div>
                        <div class="col-md-6">
                            <label for="email" class="form-label">Email</label>
                            <input id="email" name="email" type="email" class="form-control">
                        </div>
                        <div class="col-md-6">
                            <label for="phone" class="form-label">Phone</label>
                            <input id="phone" name="phone" type="tel" class="form-control">
                        </div>
                        <div class="col-md-6">
                            <label for="role" class="form-label">Role</label>
                            <select id="role" name="role" class="form-select">
                                <option value="developer">Developer</option>
                                <option value="designer">Designer</option>
                                <option value="project-manager">Project Manager</option>
                            </select>
                        </div>
                        <div class="col-12">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="active" name="active" checked>
                                <label class="form-check-label" for="active">Active</label>
                            </div>
                        </div>
                        <div class="col-12 d-flex flex-wrap gap-2">
                            <button type="submit" class="btn btn-primary px-4">Add Member</button>
                            <button type="button" id="btn-reset" class="btn btn-outline-secondary">Reset to Default</button>
                        </div>
                    </form>
                    </div>
                </div>
            </div>
        </div>

        <footer class="text-center text-muted mt-4 pb-2">
            <small>&copy; 2026 TaskFlow</small>
        </footer>
    </div>

    <script src="../assets/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="./js/navbar.js"></script>
    <script src="./js/vendor/sql-wasm.js"></script>
    <script type="module" src="./js/app.js"></script>
</body>
</html>
