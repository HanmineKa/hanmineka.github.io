<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow Team</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #f8f9ff 0%, #eef4ff 100%);
        }
    </style>
</head>
<body>
    <div class="container py-5">
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary rounded-4 shadow-sm mb-4 px-3">
            <div class="container-fluid">
                <a class="navbar-brand fw-bold" href="index.html">TaskFlow</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="mainNav">
                    <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                        <li class="nav-item"><a class="nav-link active" href="#team">Team</a></li>
                        <li class="nav-item"><a class="nav-link" href="#register">Register</a></li>
                        <li class="nav-item"><a class="nav-link" href="profile.html">Profile</a></li>
                    </ul>
                </div>
            </div>
        </nav>

        <header class="mb-4">
            <p class="text-uppercase text-primary fw-semibold mb-2">Team productivity workspace</p>
            <h1 class="display-5 fw-bold mb-0">TaskFlow</h1>
            <div id="status" class="small text-secondary mt-2">Memuat data tim...</div>
        </header>

        <main>
            <section id="team" class="card border-0 shadow-sm mb-4">
                <div class="card-body p-4 p-lg-5">
                    <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">
                        <div>
                            <h2 class="h3 mb-1">Team Members</h2>
                            <p class="text-muted mb-0">Daftar anggota tim yang aktif saat ini</p>
                        </div>
                        <span id="online-badge" class="badge bg-success-subtle text-success-emphasis px-3 py-2 rounded-pill">3 online</span>
                    </div>

                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th scope="col">Name</th>
                                    <th scope="col">NIM</th>
                                    <th scope="col">Role</th>
                                    <th scope="col">Status</th>
                                    <th scope="col">Tasks</th>
                                    <th scope="col" class="text-end">Action</th>
                                </tr>
                            </thead>
                            <tbody id="team-table-body"></tbody>
                        </table>
                    </div>
                </div>
            </section>

            <section id="register" class="card border-0 shadow-sm">
                <div class="card-body p-4 p-lg-5">
                    <h2 class="h3 mb-4">Add Team Member</h2>
                    <form class="row g-3" id="form-register">
                        <div class="col-md-6">
                            <label for="name" class="form-label">Name</label>
                            <input id="name" name="name" type="text" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label for="nim" class="form-label">NIM</label>
                            <input id="nim" name="nim" type="text" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label for="email" class="form-label">Email</label>
                            <input id="email" name="email" type="email" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label for="role" class="form-label">Role</label>
                            <select id="role" name="role" class="form-select">
                                <option value="developer">Developer</option>
                                <option value="designer">Designer</option>
                                <option value="project-manager">Project Manager</option>
                            </select>
                        </div>
                        <div class="col-12">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="active" name="active" checked>
                                <label class="form-check-label" for="active">Active</label>
                            </div>
                        </div>
                        <div class="col-12 d-flex flex-wrap gap-2">
                            <button type="submit" class="btn btn-primary px-4">Add Member</button>
                            <button type="button" id="btn-reset" class="btn btn-outline-secondary">Reset ke Default</button>
                        </div>
                    </form>
                </div>
            </section>
        </main>

        <footer class="text-center text-muted mt-4 pb-2">
            <small>&copy; 2026 TaskFlow</small>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./js/vendor/sql-wasm.js"></script>
    <script type="module" src="./js/app.js"></script>
</body>
</html>
