<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TaskFlow Tasks</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link href="../assets/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/app.css" rel="stylesheet">
</head>
<body class="taskflow-page">
  <div class="container py-3 py-md-5">
    <div id="app-navbar"></div>
    <header class="mb-4"><h1 class="h2 fw-bold mb-1">Tasks</h1><p id="status" class="text-secondary mb-0">Loading task data...</p></header>
    <main>
      <section class="card border-0 shadow-sm">
        <div class="card-body p-3 p-md-5">
          <div class="d-flex flex-wrap justify-content-between gap-2 align-items-center mb-4">
            <div><h2 class="h3 mb-1">Task list</h2><p class="text-muted mb-0">Track work across the team.</p></div>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#task-modal">+ Add Task</button>
          </div>
          <div class="row g-2 mb-3">
            <div class="col-sm-6"><label class="visually-hidden" for="filter-status">Status</label><select id="filter-status" class="form-select"><option value="">All statuses</option><option>To do</option><option>Doing</option><option>Done</option></select></div>
            <div class="col-sm-6"><label class="visually-hidden" for="filter-member">Assignee</label><select id="filter-member" class="form-select"><option value="">All assignees</option></select></div>
          </div>
          <table class="table table-hover align-middle table-stack mb-0">
            <thead class="table-light"><tr><th>Title</th><th>Assignee</th><th>Status</th><th>Due date</th><th class="text-end">Action</th></tr></thead>
            <tbody id="task-table-body"></tbody>
          </table>
        </div>
      </section>
    </main>
    <footer class="text-center text-muted mt-4 pb-2"><small>&copy; 2026 TaskFlow</small></footer>
  </div>
  <div class="modal fade" id="task-modal" tabindex="-1" aria-labelledby="task-modal-label" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-fullscreen-sm-down"><div class="modal-content">
      <div class="modal-header"><h2 class="modal-title h5" id="task-modal-label">Add Task</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
      <div class="modal-body"><form id="task-form" class="row g-3">
        <div class="col-12"><label for="task-title" class="form-label">Title</label><input id="task-title" name="title" class="form-control" required></div>
        <div class="col-md-6"><label for="task-member" class="form-label">Assignee</label><select id="task-member" name="member" class="form-select"></select></div>
        <div class="col-md-6"><label for="task-status" class="form-label">Status</label><select id="task-status" name="status" class="form-select"><option>To do</option><option>Doing</option><option>Done</option></select></div>
        <div class="col-md-6"><label for="task-due-date" class="form-label">Due date</label><input id="task-due-date" name="due_date" type="date" class="form-control"></div>
        <div class="col-12"><button class="btn btn-primary" type="submit">Add Task</button></div>
      </form></div>
    </div></div>
  </div>
  <script src="../assets/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="./js/navbar.js"></script>
  <script src="./js/vendor/sql-wasm.js"></script>
  <script type="module" src="./js/tasks.js"></script>
</body>
</html>
