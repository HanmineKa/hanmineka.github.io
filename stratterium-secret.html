<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>...</title>
<script src="https://cdn.jsdelivr.net/npm/animejs@3.2.2/lib/anime.min.js"></script>
<style>
  /* shell ini sengaja polos — semua styling "asli" datang dari payload.html
     yang baru ada setelah dekripsi berhasil */
  html, body{ margin:0; background:#0a0a0a; min-height:100vh; }
  #subtitleLayer{
    position:fixed; left:0; right:0; bottom:8%;
    text-align:center; padding:0 24px;
    font-size:22px; line-height:1.4;
    pointer-events:none;
    z-index:50;
    transition: opacity .25s ease;
    /* fallback sebelum cue pertama render / kalau JS telat load —
       tetap kebaca di atas scene apa pun */
    text-shadow: 0 1px 2px rgba(0,0,0,0.9), 0 2px 6px rgba(0,0,0,0.75), 0 0 14px rgba(0,0,0,0.5);
  }
  #playFallback{
    position:fixed; inset:0; margin:auto; width:140px; height:56px;
    z-index:100; cursor:pointer;
    font-family:sans-serif; font-size:16px;
    background:#f2ecd6; border:none; border-radius:6px;
  }
</style>
</head>
<body>
<div id="secretRoot"></div>
<div id="subtitleLayer"></div>
<audio id="stratteriumAudio" src="musics/stratterium.mp3" preload="auto"></audio>

<script>
(function () {
  const STORAGE_KEY = 'stratterium_payload';
  const raw = sessionStorage.getItem(STORAGE_KEY);

  // tidak ada payload (akses langsung tanpa lewat gate, atau sudah dipakai
  // sekali sebelumnya) -> tendang balik ke index, jangan render apa pun
  if (!raw) {
    window.location.replace('index.html');
    return;
  }

  // sekali pakai: hapus dari sessionStorage begitu dibaca, supaya reload/back
  // button tidak bisa nampilin ulang tanpa masukin password lagi
  sessionStorage.removeItem(STORAGE_KEY);

  let payload;
  try {
    payload = JSON.parse(raw);
  } catch (e) {
    window.location.replace('index.html');
    return;
  }

  // 1) render markup, style, dan builder dari payload yang sudah didekripsi.
  const secretRoot = document.getElementById('secretRoot');
  const payloadDocument = new DOMParser().parseFromString(payload.html, 'text/html');
  payloadDocument.querySelectorAll('style').forEach((style) => {
    document.head.appendChild(style.cloneNode(true));
  });
  secretRoot.innerHTML = payloadDocument.body ? payloadDocument.body.innerHTML : payload.html;
  payloadDocument.querySelectorAll('script').forEach((script) => {
    const executable = document.createElement('script');
    executable.textContent = script.textContent;
    document.body.appendChild(executable);
    executable.remove();
  });

  // 2) jalankan animation-framework.js dari payload (bukan eval global,
  //    dibungkus Function supaya scope-nya lebih terkendali)
  try {
    new Function(payload.animationFramework)();
  } catch (e) {
    console.error('Gagal load animation framework:', e);
  }

  if (!window.AnimationFramework) {
    console.error('AnimationFramework tidak terdefinisi setelah payload dijalankan.');
    return;
  }

  // 3) pasang aset gambar (base64 -> object URL, lebih ringan dari data URI
  //    mentah dan gampang dipakai ulang sebagai background-image)
  const assetUrls = {};
  Object.entries(payload.assets).forEach(([key, b64]) => {
    const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
    const blob = new Blob([bytes], { type: 'image/webp' });
    assetUrls[key] = URL.createObjectURL(blob);
  });
  document.documentElement.style.setProperty('--bg1', `url(${assetUrls.background1})`);
  document.documentElement.style.setProperty('--bg2', `url(${assetUrls.background2})`);
  document.documentElement.style.setProperty('--character-src', `url(${assetUrls.character})`);
  document.documentElement.style.setProperty('--label-src', `url(${assetUrls.labelKertas})`);
  const sceneStage = document.createElement('main');
  sceneStage.id = 'sceneStage';
  Object.assign(sceneStage.style, {
    position: 'fixed', inset: '0', overflow: 'hidden', display: 'block',
    backgroundPosition: 'center', backgroundSize: 'cover', backgroundRepeat: 'no-repeat',
    transition: 'background-image 700ms ease'
  });
  const character = document.createElement('img');
  character.id = 'character';
  character.alt = '';
  character.src = assetUrls.character;
  const label = document.createElement('img');
  label.id = 'paperLabel';
  label.alt = 'Thank you!!';
  label.src = assetUrls.labelKertas;
  const visualElements = [
    document.getElementById('cluster'), document.getElementById('scaleA'),
    document.getElementById('scaleB'), document.querySelector('.charm-row'),
    document.getElementById('starButton'), character, label
  ].filter(Boolean);
  secretRoot.replaceChildren(sceneStage);
  visualElements.forEach((element) => sceneStage.appendChild(element));

  const groupIds = {
    clusterGems: 'clusterGem', clusterStars: 'clusterStar',
    charms: ['charmTrebleClef', 'charmNote8', 'charmNote16'],
    scaleA: 'scaleA', scaleB: 'scaleB', headlineStar: 'starButton'
  };
  const groupElements = {
    character: () => [character],
    label: () => [label],
    clusterGems: () => AnimationFramework.getAll('clusterGem'),
    clusterStars: () => AnimationFramework.getAll('clusterStar'),
    charms: () => ['charmTrebleClef', 'charmNote8', 'charmNote16'].map((id) => document.getElementById(id)).filter(Boolean),
    scaleA: () => [document.getElementById('scaleA')].filter(Boolean),
    scaleB: () => [document.getElementById('scaleB')].filter(Boolean),
    headlineStar: () => [document.getElementById('starButton')].filter(Boolean)
  };
  const groupContainers = {
    character,
    label,
    clusterGems: document.getElementById('cluster'),
    clusterStars: document.getElementById('cluster'),
    charms: document.querySelector('.charm-row'),
    scaleA: document.getElementById('scaleA'),
    scaleB: document.getElementById('scaleB'),
    headlineStar: document.getElementById('starButton')
  };
  let removeGemProximityShift = null;
  const timeline = payload.sceneTimeline || { templates: {}, scenes: [] };

  function resolveScene(scene) {
    const template = timeline.templates[scene.template] || {};
    const parent = template.extends ? (timeline.templates[template.extends] || {}) : {};
    return {
      ...parent, ...template, ...scene,
      camera: { ...(parent.camera || {}), ...(template.camera || {}), ...(scene.camera || {}) },
      layers: { ...(parent.layers || {}), ...(template.layers || {}), ...(scene.layers || {}) },
      interaction: { ...(parent.interaction || {}), ...(template.interaction || {}), ...(scene.interaction || {}) }
    };
  }

  function applyScene(rawScene) {
    const scene = resolveScene(rawScene);
    AnimationFramework.stopAll();
    if (removeGemProximityShift) removeGemProximityShift();
    removeGemProximityShift = null;
    const hide = (element) => {
      element.style.setProperty('display', 'none', 'important');
      anime.remove(element);
      element.style.transform = '';
    };
    const show = (element) => element.style.setProperty('display', '', 'important');
    if (scene.template === 'blackTransition') {
      AnimationFramework.effects.blackTransition(scene.text || '', {
        color: scene.color || '#fff', size: scene.size || 'medium',
        durationMs: Math.max(1, ((scene.end == null ? scene.start + 1 : scene.end) - scene.start) * 1000)
      });
      return;
    }
    visualElements.forEach(hide);
    Object.values(groupElements).forEach((getElements) => {
      getElements().forEach(hide);
    });
    sceneStage.style.backgroundImage = scene.background === 'background2'
      ? `url(${assetUrls.background2})` : `url(${assetUrls.background1})`;
    Object.assign(character.style, {
      position: 'absolute', objectFit: 'contain', transform: 'translateX(-50%)',
      width: scene.camera.focus === 'character-bottom-center' ? 'min(62vw, 680px)' : 'min(48vw, 520px)',
      maxHeight: scene.camera.focus === 'character-bottom-center' ? '86vh' : '78vh',
      left: '50%', bottom: scene.camera.focus === 'character-bottom-center' ? '-3%' : '3%'
    });
    Object.assign(label.style, {
      position: 'absolute', width: 'min(42vw, 420px)', maxHeight: '45vh', objectFit: 'contain',
      left: '50%', top: '50%', transform: 'translate(-50%, -50%)'
    });
    const elements = {
      character, label,
      clusterGems: document.getElementById('cluster'), clusterStars: document.getElementById('cluster'),
      charms: document.querySelector('.charm-row'), scaleA: document.getElementById('scaleA'),
      scaleB: document.getElementById('scaleB'), headlineStar: document.getElementById('starButton')
    };
    Object.entries(scene.layers || {}).forEach(([name, layer]) => {
      const element = elements[name];
      if (!element || layer.visible === false) return;
      if (groupContainers[name]) show(groupContainers[name]);
      groupElements[name]().forEach(show);
      if (layer.effect && groupIds[name] && AnimationFramework.effects[layer.effect]) {
        AnimationFramework.effects[layer.effect](groupIds[name]);
      }
    });
    Object.assign(elements.clusterGems.style, { position: 'absolute', inset: '8% 4%', width: '92%', height: '84%' });
    Object.assign(elements.charms.style, { position: 'absolute', inset: '12% 8%' });
    [
      ['#charmTrebleClef', { left: '-8%', top: '4%' }],
      ['#charmNote8', { right: '-8%', top: '38%' }],
      ['#charmNote16', { left: '-8%', bottom: '3%' }]
    ].forEach(([selector, position]) => {
      const charm = elements.charms.querySelector(selector);
      if (charm) {
        Object.assign(charm.style, { position: 'absolute', ...position });
        charm.style.setProperty('--w', 'clamp(56px, 8vw, 92px)');
        charm.style.setProperty('--h', 'clamp(72px, 10vw, 118px)');
      }
    });
    const starSlots = [
      ['#clusterStar0', { left: '26%', top: '2%' }],
      ['#clusterStar1', { left: '42%', top: '1%' }],
      ['#clusterStar2', { left: '62%', top: '2%' }],
      ['#clusterStar3', { left: '76%', top: '12%' }],
      ['#clusterStar4', { left: '84%', top: '55%' }],
      ['#clusterStar5', { left: '70%', top: '82%' }],
      ['#clusterStar6', { left: '28%', top: '84%' }],
      ['#clusterStar7', { left: '50%', top: '5%' }]
    ];
    starSlots.forEach(([selector, position]) => {
      const star = elements.clusterStars.querySelector(selector);
      if (star) Object.assign(star.style, { position: 'absolute', ...position });
    });
    Object.assign(elements.scaleA.style, { position: 'absolute', top: '10%', left: '5%' });
    Object.assign(elements.scaleB.style, { position: 'absolute', right: '5%', bottom: '10%' });
    Object.assign(elements.headlineStar.style, { position: 'absolute', top: '12%', left: '50%', transform: 'translateX(-50%)' });
    const proximity = scene.interaction && scene.interaction.gemProximityShift;
    if (proximity && proximity.trigger === 'cursor-proximity') {
      removeGemProximityShift = AnimationFramework.effects.gemProximityShift(proximity.target || 'clusterGems');
    }
  }

  // 4) scan manifest id (star/gem/charm/scale) yang baru saja dirender
  window.AnimationFramework.init();

  // 5) subtitle — render SEKALI per pergantian cue (bukan tiap frame),
  //    per segmen dapet elemen sendiri supaya efeknya bisa beda-beda dalam
  //    satu baris (mis. "Seperti" tanpa efek, "Kau sangat menyebalkan!" JoyBounce)
  try {
    new Function(payload.textEffects)();
  } catch (e) {
    console.error('Gagal load text effects:', e);
  }

  const subtitleEl = document.getElementById('subtitleLayer');
  const audio = document.getElementById('stratteriumAudio');
  const cues = (payload.subtitleCues && payload.subtitleCues.cues) || [];
  const defaultStyle = (payload.subtitleCues && payload.subtitleCues.meta && payload.subtitleCues.meta.defaultStyle) || {};

  let activeCueId = null;
  let activeSegmentEls = [];

  function clearSubtitle() {
    activeSegmentEls.forEach(el => window.TextEffects && window.TextEffects.stopAll(el));
    activeSegmentEls = [];
    subtitleEl.style.opacity = '0';
    subtitleEl.innerHTML = '';
    activeCueId = null;
  }

  function renderCue(cue) {
    subtitleEl.style.opacity = '0';
    subtitleEl.innerHTML = '';
    const style = cue.style || defaultStyle;
    subtitleEl.style.color = style.color || '';
    subtitleEl.style.textShadow = style.textShadow || '';
    subtitleEl.style.fontFamily = style.fontFamily || '';
    subtitleEl.style.fontWeight = style.fontWeight || '';

    activeSegmentEls = cue.segments.map(seg => {
      const span = document.createElement('span');
      span.textContent = seg.text;
      span.style.display = 'inline-block';
      subtitleEl.appendChild(span);
      if (window.TextEffects && seg.effects && seg.effects.length) {
        window.TextEffects.run(span, seg.effects);
      }
      return span;
    });
    activeCueId = cue.id;
    requestAnimationFrame(() => {
      if (activeCueId === cue.id) subtitleEl.style.opacity = '1';
    });
  }

  audio.addEventListener('timeupdate', () => {
    const t = audio.currentTime;
    const cue = cues.find(c => t >= c.start && t < c.end);
    if (!cue) {
      if (activeCueId !== null) clearSubtitle();
      return;
    }
    if (cue.id !== activeCueId) {
      clearSubtitle();
      renderCue(cue);
    }
  });

  // 6) jalankan timeline scene, sinkron ke audio yang sama
  document.addEventListener('stratterium:scene', (e) => {
    applyScene(e.detail);
  });
  if (payload.sceneTimeline) {
    window.AnimationFramework.effects.blackTransition('', { durationMs: 900, fromBlack: true });
    window.AnimationFramework.runTimeline(payload.sceneTimeline, audio);
  }

  // 7) mulai audio — browser modern butuh interaksi user, jadi sudah lewat
  //    klik tombol bintang + submit password, biasanya cukup untuk lolos
  //    autoplay policy. Kalau tetap diblokir, tampilkan tombol play manual.
  audio.play().catch(() => {
    const btn = document.createElement('button');
    btn.id = 'playFallback';
    btn.textContent = 'Putar';
    btn.addEventListener('click', () => { audio.play(); btn.remove(); }, { once: true });
    document.body.appendChild(btn);
  });
})();
</script>
</body>
</html>
