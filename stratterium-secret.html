<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>...</title>
<script src="https://cdn.jsdelivr.net/npm/animejs@3.2.2/lib/anime.min.js"></script>
<style>
  /* shell ini sengaja polos — semua styling "asli" datang dari payload.html
     yang baru ada setelah dekripsi berhasil */
  html, body{ margin:0; background:#0a0a0a; min-height:100vh; }
  #subtitleLayer{
    position:fixed; left:0; right:0; bottom:8%;
    text-align:center; padding:0 24px;
    font-size:22px; line-height:1.4;
    pointer-events:none;
    z-index:50;
    transition: opacity .25s ease;
  }
  #playFallback{
    position:fixed; inset:0; margin:auto; width:140px; height:56px;
    z-index:100; cursor:pointer;
    font-family:sans-serif; font-size:16px;
    background:#f2ecd6; border:none; border-radius:6px;
  }
</style>
</head>
<body>
<div id="secretRoot"></div>
<div id="subtitleLayer"></div>
<audio id="stratteriumAudio" src="musics/stratterium.mp3" preload="auto"></audio>

<script>
(function () {
  const STORAGE_KEY = 'stratterium_payload';
  const raw = sessionStorage.getItem(STORAGE_KEY);

  // tidak ada payload (akses langsung tanpa lewat gate, atau sudah dipakai
  // sekali sebelumnya) -> tendang balik ke index, jangan render apa pun
  if (!raw) {
    window.location.replace('index.html');
    return;
  }

  // sekali pakai: hapus dari sessionStorage begitu dibaca, supaya reload/back
  // button tidak bisa nampilin ulang tanpa masukin password lagi
  sessionStorage.removeItem(STORAGE_KEY);

  let payload;
  try {
    payload = JSON.parse(raw);
  } catch (e) {
    window.location.replace('index.html');
    return;
  }

  // 1) render markup, styles, and builders from the decrypted document.
  const secretRoot = document.getElementById('secretRoot');
  const payloadDocument = new DOMParser().parseFromString(payload.html, 'text/html');
  payloadDocument.querySelectorAll('style').forEach((style) => {
    document.head.appendChild(style.cloneNode(true));
  });
  secretRoot.innerHTML = payloadDocument.body ? payloadDocument.body.innerHTML : payload.html;
  payloadDocument.querySelectorAll('script').forEach((script) => {
    const executable = document.createElement('script');
    executable.textContent = script.textContent;
    document.body.appendChild(executable);
    executable.remove();
  });

  // 2) jalankan animation-framework.js dari payload (bukan eval global,
  //    dibungkus Function supaya scope-nya lebih terkendali)
  try {
    new Function(payload.animationFramework)();
  } catch (e) {
    console.error('Gagal load animation framework:', e);
  }

  if (!window.AnimationFramework) {
    console.error('AnimationFramework tidak terdefinisi setelah payload dijalankan.');
    return;
  }

  // 3) pasang aset gambar (base64 -> object URL, lebih ringan dari data URI
  //    mentah dan gampang dipakai ulang sebagai background-image)
  const assetUrls = {};
  Object.entries(payload.assets).forEach(([key, b64]) => {
    const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
    const blob = new Blob([bytes], { type: 'image/webp' });
    assetUrls[key] = URL.createObjectURL(blob);
  });
  document.documentElement.style.setProperty('--bg1', `url(${assetUrls.background1})`);
  document.documentElement.style.setProperty('--bg2', `url(${assetUrls.background2})`);

  const sceneStage = document.createElement('main');
  sceneStage.id = 'sceneStage';
  Object.assign(sceneStage.style, {
    position: 'fixed', inset: '0', overflow: 'hidden', display: 'block',
    backgroundPosition: 'center', backgroundSize: 'cover', backgroundRepeat: 'no-repeat'
  });
  const cluster = document.getElementById('cluster');
  const scaleA = document.getElementById('scaleA');
  const scaleB = document.getElementById('scaleB');
  const charmRow = document.querySelector('.charm-row');
  const headlineStar = document.getElementById('starButton');
  const character = document.createElement('img');
  character.id = 'character';
  character.alt = '';
  character.src = assetUrls.character;
  const label = document.createElement('img');
  label.id = 'paperLabel';
  label.alt = 'Thank you!!';
  label.src = assetUrls.labelKertas;
  secretRoot.replaceChildren(sceneStage);
  [cluster, scaleA, scaleB, charmRow, headlineStar, character, label]
    .filter(Boolean)
    .forEach((element) => sceneStage.appendChild(element));

  const visualElements = [cluster, scaleA, scaleB, charmRow, headlineStar, character, label].filter(Boolean);
  const setVisible = (element, visible) => { element.style.display = visible ? '' : 'none'; };
  const groupIds = {
    clusterGems: 'clusterGem',
    clusterStars: 'clusterStar',
    charms: ['charmTrebleClef', 'charmNote8', 'charmNote16'],
    scaleA: 'scaleA',
    scaleB: 'scaleB',
    headlineStar: 'starButton'
  };
  const effectMap = {
    gemTwinkle: 'gemTwinkle',
    starStatic: 'starStatic',
    starTilt: 'starTilt',
    charmSwing: 'charmSwing',
    scaleBob: 'scaleBob',
    holdStatic: 'holdStatic'
  };
  const timeline = payload.sceneTimeline || { templates: {}, scenes: [] };
  let removeGemProximityShift = null;

  const resolveScene = (scene) => {
    const template = timeline.templates[scene.template] || {};
    const parent = template.extends ? (timeline.templates[template.extends] || {}) : {};
    return {
      ...parent,
      ...template,
      ...scene,
      camera: { ...(parent.camera || {}), ...(template.camera || {}), ...(scene.camera || {}) },
      layers: { ...(parent.layers || {}), ...(template.layers || {}), ...(scene.layers || {}) },
      interaction: { ...(parent.interaction || {}), ...(template.interaction || {}), ...(scene.interaction || {}) }
    };
  };

  const applyScene = (rawScene) => {
    const scene = resolveScene(rawScene);
    AnimationFramework.stopAll();
    if (removeGemProximityShift) removeGemProximityShift();
    removeGemProximityShift = null;
    visualElements.forEach((element) => setVisible(element, false));
    sceneStage.style.backgroundImage = scene.background === 'background2'
      ? `url(${assetUrls.background2})`
      : `url(${assetUrls.background1})`;
    if (scene.template === 'blackTransition') {
      AnimationFramework.effects.blackTransition(scene.text || '', {
        color: scene.color || scene.template.defaultColor,
        size: scene.size || 'medium',
        durationMs: Math.max(1, (scene.end == null ? 1 : scene.end - scene.start) * 1000)
      });
      return;
    }
    const focus = scene.camera && scene.camera.focus;
    const characterPosition = focus === 'character-bottom-center'
      ? { width: 'min(62vw, 680px)', maxHeight: '86vh', left: '50%', bottom: '-3%' }
      : { width: 'min(48vw, 520px)', maxHeight: '78vh', left: '50%', bottom: '3%' };
    Object.assign(character.style, {
      position: 'absolute', objectFit: 'contain', transform: 'translateX(-50%)', ...characterPosition
    });
    Object.assign(label.style, {
      position: 'absolute', width: 'min(42vw, 420px)', maxHeight: '45vh', objectFit: 'contain',
      left: '50%', top: '50%', transform: 'translate(-50%, -50%)'
    });

    const layers = scene.layers || {};
    Object.entries(layers).forEach(([layerName, layer]) => {
      const element = layerName === 'character' ? character
        : layerName === 'label' ? label
          : layerName === 'clusterGems' || layerName === 'clusterStars' ? cluster
            : layerName === 'charms' ? charmRow
              : layerName === 'scaleA' ? scaleA
                : layerName === 'scaleB' ? scaleB
                  : layerName === 'headlineStar' ? headlineStar : null;
      if (!element || layer.visible === false) return;
      setVisible(element, true);
      const effectName = effectMap[layer.effect];
      if (effectName && groupIds[layerName]) AnimationFramework.effects[effectName](groupIds[layerName]);
    });

    Object.assign(cluster.style, { position: 'absolute', inset: '8% 4%', width: '92%', height: '84%' });
    Object.assign(charmRow.style, { position: 'absolute', inset: '12% 8%', justifyContent: 'space-around', alignItems: 'flex-start' });
    Object.assign(scaleA.style, { position: 'absolute', top: '10%', left: '5%' });
    Object.assign(scaleB.style, { position: 'absolute', right: '5%', bottom: '10%' });
    Object.assign(headlineStar.style, { position: 'absolute', top: '12%', left: '50%', transform: 'translateX(-50%)' });

    const proximity = scene.interaction && scene.interaction.gemProximityShift;
    if (proximity && proximity.trigger === 'cursor-proximity') {
      removeGemProximityShift = AnimationFramework.effects.gemProximityShift(
        proximity.target || 'clusterGems'
      );
    }
  };

  // 4) scan manifest id (star/gem/charm/scale) yang baru saja dirender
  window.AnimationFramework.init();

  // 5) subtitle — render manual per timeupdate, style default vs override
  //    per-cue (abu-abu kebiruan di 2 baris penutup)
  const subtitleEl = document.getElementById('subtitleLayer');
  const audio = document.getElementById('stratteriumAudio');
  const cues = (payload.subtitleCues && payload.subtitleCues.cues) || [];
  const defaultStyle = (payload.subtitleCues && payload.subtitleCues.meta && payload.subtitleCues.meta.defaultStyle) || {};

  audio.addEventListener('timeupdate', () => {
    const t = audio.currentTime;
    const cue = cues.find(c => t >= c.start && t < c.end);
    if (!cue) { subtitleEl.textContent = ''; return; }

    subtitleEl.innerHTML = cue.segments.map(seg => `<span>${seg.text}</span>`).join(' ');
    const style = cue.style || defaultStyle;
    if (style.color) subtitleEl.style.color = style.color;
    if (style.textShadow) subtitleEl.style.textShadow = style.textShadow;
    if (style.fontFamily) subtitleEl.style.fontFamily = style.fontFamily;
    if (style.fontWeight) subtitleEl.style.fontWeight = style.fontWeight;
  });

  document.addEventListener('stratterium:scene', (e) => {
    applyScene(e.detail);
  });

  // 6) jalankan timeline scene, sinkron ke audio yang sama
  if (payload.sceneTimeline) {
    window.AnimationFramework.runTimeline(timeline, audio);
  }

  // 7) mulai audio — browser modern butuh interaksi user, jadi sudah lewat
  //    klik tombol bintang + submit password, biasanya cukup untuk lolos
  //    autoplay policy. Kalau tetap diblokir, tampilkan tombol play manual.
  audio.play().catch(() => {
    const btn = document.createElement('button');
    btn.id = 'playFallback';
    btn.textContent = 'Putar';
    btn.addEventListener('click', () => { audio.play(); btn.remove(); }, { once: true });
    document.body.appendChild(btn);
  });
})();
</script>
</body>
</html>
