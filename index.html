<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Hujan Interaktif — Demo</title>

<!-- anime.js CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js" defer></script>

<style>
  :root{
    --sun-size:120px;
    --cloud-color: rgba(255,255,255,0.92);
    --cloud-shadow: rgba(0,0,0,0.08);
  }
  html,body{height:100%;margin:0;font-family:Inter,system-ui,Segoe UI,Roboto;}
  body{
    overflow:hidden;
    background: linear-gradient(180deg,#1f2b3a 0%, #2b3b4a 60%, #0b1220 100%);
    transition: background 1s linear;
  }

  /* container */
  #stage{position:relative;width:100vw;height:100vh;touch-action:none;user-select:none;}

  /* sun/moon */
  .orb{
    position:absolute;
    width:var(--sun-size);
    height:var(--sun-size);
    border-radius:50%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25), inset 0 -10px 30px rgba(255,255,255,0.06);
    pointer-events:none;
    transform: translate(-50%,-50%);
    z-index:6;
  }
  .sun{
    background: radial-gradient(circle at 30% 30%, #fff7c2 0%, #ffd86b 30%, #ffb347 60%, #ff8c00 100%);
    filter: drop-shadow(0 10px 30px rgba(255,160,50,0.25));
  }
  .moon{
    background: radial-gradient(circle at 30% 30%, #ffffff 0%, #dfe9f3 30%, #b8c6db 60%, #9aa9c2 100%);
    box-shadow: 0 6px 20px rgba(0,0,0,0.3);
    mix-blend-mode: screen;
    filter: blur(0.2px);
  }

  /* clouds */
  .cloud{
    position:absolute;
    top:10%;
    left:10%;
    width:360px;
    height:120px;
    pointer-events:none;
    z-index:5;
    filter: drop-shadow(0 10px 30px var(--cloud-shadow));
  }
  .cloud svg{width:100%;height:100%;}
  .cloud-group{position:absolute;will-change:transform;pointer-events:auto;}

  /* canvas layers */
  canvas{position:absolute;left:0;top:0;z-index:1;display:block;}
  #rainCanvas{z-index:2;pointer-events:none;}
  #interactionCanvas{z-index:4;pointer-events:none;}

  /* UI hint */
  .hint{
    position: absolute;
    left: 16px;
    bottom: 16px;
    color: rgba(255,255,255,0.85);
    font-size:13px;
    z-index:10;
    background: rgba(0,0,0,0.25);
    padding:8px 12px;border-radius:8px;
    backdrop-filter: blur(6px);
  }

  /* responsive */
  @media (max-width:600px){
    :root{--sun-size:88px;}
    .cloud{width:260px;height:90px;}
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="bgCanvas"></canvas>
  <canvas id="rainCanvas"></canvas>
  <canvas id="interactionCanvas"></canvas>

  <!-- Sun / Moon -->
  <div id="orb" class="orb sun" aria-hidden="true"></div>

  <!-- Clouds (3 groups) -->
  <div id="clouds">
    <div class="cloud cloud-group" id="cloud1" style="left:5%;top:12%;transform:scale(0.9);">
      <svg viewBox="0 0 640 200" preserveAspectRatio="xMidYMid meet">
        <g fill="var(--cloud-color)">
          <ellipse cx="160" cy="100" rx="160" ry="70"></ellipse>
          <ellipse cx="320" cy="80" rx="120" ry="60"></ellipse>
          <ellipse cx="480" cy="100" rx="140" ry="70"></ellipse>
        </g>
      </svg>
    </div>

    <div class="cloud cloud-group" id="cloud2" style="left:30%;top:6%;transform:scale(0.8);">
      <svg viewBox="0 0 640 200" preserveAspectRatio="xMidYMid meet">
        <g fill="var(--cloud-color)">
          <ellipse cx="140" cy="100" rx="140" ry="60"></ellipse>
          <ellipse cx="300" cy="80" rx="110" ry="50"></ellipse>
          <ellipse cx="420" cy="110" rx="150" ry="70"></ellipse>
        </g>
      </svg>
    </div>

    <div class="cloud cloud-group" id="cloud3" style="left:62%;top:18%;transform:scale(1.05);">
      <svg viewBox="0 0 640 200" preserveAspectRatio="xMidYMid meet">
        <g fill="var(--cloud-color)">
          <ellipse cx="160" cy="100" rx="160" ry="70"></ellipse>
          <ellipse cx="320" cy="80" rx="120" ry="60"></ellipse>
          <ellipse cx="480" cy="100" rx="140" ry="70"></ellipse>
        </g>
      </svg>
    </div>
  </div>

  <div class="hint">Gerakkan kursor: pisahkan hujan & sentuh awan untuk efek asap</div>
</div>

<script>
/* ---------- Setup canvases ---------- */
const stage = document.getElementById('stage');
const bgCanvas = document.getElementById('bgCanvas');
const rainCanvas = document.getElementById('rainCanvas');
const interCanvas = document.getElementById('interactionCanvas');
const orb = document.getElementById('orb');
const clouds = Array.from(document.querySelectorAll('.cloud-group'));

function resizeAll(){
  const w = window.innerWidth, h = window.innerHeight;
  [bgCanvas, rainCanvas, interCanvas].forEach(c=>{
    c.width = w; c.height = h; c.style.width = w+'px'; c.style.height = h+'px';
  });
}
window.addEventListener('resize', resizeAll);
resizeAll();

/* ---------- Background gradient that changes with time ---------- */
function setSkyByHour(hour){
  // morning 5-11, day 11-15, evening 15-18, night 18-5
  if(hour>=5 && hour<11){
    document.body.style.background = 'linear-gradient(180deg,#ffdca8 0%, #cfe9ff 60%, #eaf6ff 100%)';
    orb.className = 'orb sun';
  } else if(hour>=11 && hour<15){
    document.body.style.background = 'linear-gradient(180deg,#87CEEB 0%, #bfe9ff 60%, #fefefe 100%)';
    orb.className = 'orb sun';
  } else if(hour>=15 && hour<18){
    document.body.style.background = 'linear-gradient(180deg,#ffb47b 0%, #ffd9a8 60%, #2b3b4a 100%)';
    orb.className = 'orb sun';
  } else {
    document.body.style.background = 'linear-gradient(180deg,#0b1220 0%, #1b2a3a 60%, #07101a 100%)';
    orb.className = 'orb moon';
  }
}

/* ---------- Sun/Moon movement along an arc ---------- */
function positionOrbByHour(hour){
  // map hour (0-23) to angle along arc (sunrise ~ 6 -> left-bottom, noon -> top, sunset ~18 -> right-bottom)
  const t = (hour + (new Date().getMinutes()/60)) / 24; // 0..1
  // angle from 200deg to -20deg (in radians)
  const start = 200 * Math.PI/180, end = -20 * Math.PI/180;
  const ang = start + (end - start) * t;
  const cx = window.innerWidth/2, cy = window.innerHeight*0.9, radius = Math.min(window.innerWidth, window.innerHeight)*0.45;
  const x = cx + radius * Math.cos(ang);
  const y = cy + radius * Math.sin(ang);
  orb.style.left = x + 'px';
  orb.style.top = y + 'px';
  // subtle glow intensity by hour
  const intensity = (hour>=6 && hour<18) ? 1 : 0.35;
  orb.style.opacity = intensity;
}

/* ---------- Clouds gentle movement ---------- */
clouds.forEach((c,i)=>{
  const baseX = parseFloat(c.style.left) || 10;
  anime({
    targets: c,
    translateX: [0, (i%2?40:-40)],
    duration: 12000 + i*2000,
    direction: 'alternate',
    easing: 'easeInOutSine',
    loop: true
  });
});

/* ---------- Rain simulation (canvas) ---------- */
const rCtx = rainCanvas.getContext('2d');
let drops = [];
function initRain(count=300){
  drops = [];
  for(let i=0;i<count;i++){
    drops.push({
      x: Math.random()*rainCanvas.width,
      y: Math.random()*rainCanvas.height,
      len: 10 + Math.random()*25,
      speed: 2 + Math.random()*6,
      thickness: 0.8 + Math.random()*1.6,
      wind: -1 + Math.random()*2
    });
  }
}
initRain(380);

function drawRain(){
  rCtx.clearRect(0,0,rainCanvas.width,rainCanvas.height);
  rCtx.strokeStyle = 'rgba(174,194,224,0.55)';
  rCtx.lineWidth = 1;
  rCtx.lineCap = 'round';
  rCtx.beginPath();
  for(let d of drops){
    rCtx.moveTo(d.x, d.y);
    rCtx.lineTo(d.x + d.wind*3, d.y + d.len);
  }
  rCtx.stroke();
  updateRain();
}
function updateRain(){
  for(let d of drops){
    d.x += d.wind;
    d.y += d.speed;
    if(d.y > rainCanvas.height + 20){
      d.y = -20 - Math.random()*100;
      d.x = Math.random()*rainCanvas.width;
    }
    if(d.x < -50) d.x = rainCanvas.width + 50;
    if(d.x > rainCanvas.width + 50) d.x = -50;
  }
}

/* ---------- Interaction: cursor bubble that clears rain + smoke on cloud touch ---------- */
const iCtx = interCanvas.getContext('2d');
let mouse = {x:-9999,y:-9999,down:false};
const bubbleRadius = 120;

function drawInteraction(){
  iCtx.clearRect(0,0,interCanvas.width,interCanvas.height);

  // bubble: clear rain visually by drawing a radial gradient mask on top
  const g = iCtx.createRadialGradient(mouse.x, mouse.y, bubbleRadius*0.1, mouse.x, mouse.y, bubbleRadius);
  g.addColorStop(0, 'rgba(255,255,255,0.0)');
  g.addColorStop(0.6, 'rgba(255,255,255,0.02)');
  g.addColorStop(1, 'rgba(255,255,255,0.06)');
  iCtx.fillStyle = g;
  iCtx.beginPath();
  iCtx.arc(mouse.x, mouse.y, bubbleRadius, 0, Math.PI*2);
  iCtx.fill();

  // draw subtle ripple line
  iCtx.strokeStyle = 'rgba(255,255,255,0.08)';
  iCtx.lineWidth = 1.2;
  iCtx.beginPath();
  iCtx.arc(mouse.x, mouse.y, bubbleRadius*0.9, 0, Math.PI*2);
  iCtx.stroke();

  // smoke particles handled separately
  updateSmoke();
}

/* ---------- Smoke system when cursor touches cloud ---------- */
let smokes = [];
function spawnSmoke(x,y){
  for(let i=0;i<8;i++){
    smokes.push({
      x: x + (Math.random()-0.5)*40,
      y: y + (Math.random()-0.5)*20,
      vx: (Math.random()-0.5)*0.6,
      vy: -0.6 - Math.random()*1.2,
      life: 60 + Math.random()*40,
      size: 8 + Math.random()*18,
      alpha: 0.9
    });
  }
}
function updateSmoke(){
  for(let i=smokes.length-1;i>=0;i--){
    const s = smokes[i];
    s.x += s.vx;
    s.y += s.vy;
    s.life--;
    s.alpha *= 0.995;
    iCtx.fillStyle = `rgba(220,220,220,${Math.max(0, s.alpha*0.6)})`;
    iCtx.beginPath();
    iCtx.ellipse(s.x, s.y, s.size, s.size*0.6, 0, 0, Math.PI*2);
    iCtx.fill();
    if(s.life<=0 || s.alpha<0.02) smokes.splice(i,1);
  }
}

/* ---------- Detect cursor touching cloud bounding boxes ---------- */
function checkCloudTouches(){
  clouds.forEach(c=>{
    const rect = c.getBoundingClientRect();
    // expand rect a bit
    const pad = 20;
    if(mouse.x >= rect.left - pad && mouse.x <= rect.right + pad &&
       mouse.y >= rect.top - pad && mouse.y <= rect.bottom + pad){
      // spawn smoke occasionally
      if(Math.random() < 0.12) spawnSmoke(mouse.x, mouse.y + 10);
      // subtle cloud wobble
      anime({
        targets: c,
        translateY: [-2,2],
        duration: 600,
        direction: 'alternate',
        easing: 'easeOutSine'
      });
    }
  });
}

/* ---------- Mouse / touch handlers ---------- */
window.addEventListener('mousemove', (e)=>{
  mouse.x = e.clientX; mouse.y = e.clientY;
});
window.addEventListener('mouseleave', ()=>{ mouse.x = -9999; mouse.y = -9999; });
window.addEventListener('touchmove', (e)=>{
  const t = e.touches[0];
  mouse.x = t.clientX; mouse.y = t.clientY;
}, {passive:true});
window.addEventListener('touchend', ()=>{ mouse.x = -9999; mouse.y = -9999; });

/* ---------- Main loop ---------- */
function loop(){
  drawRain();
  drawInteraction();
  checkCloudTouches();
  requestAnimationFrame(loop);
}
loop();

/* ---------- Initialize sky & orb position based on local time ---------- */
function refreshTimeBased(){
  const now = new Date();
  const hour = now.getHours();
  setSkyByHour(hour);
  positionOrbByHour(hour);
}
refreshTimeBased();
setInterval(refreshTimeBased, 60*1000); // update tiap menit

/* ---------- Small polish: parallax for orb on mouse move ---------- */
window.addEventListener('mousemove', (e)=>{
  const nx = (e.clientX / window.innerWidth - 0.5) * 20;
  const ny = (e.clientY / window.innerHeight - 0.5) * 12;
  orb.style.transform = `translate(-50%,-50%) translate(${nx}px, ${ny}px)`;
});

/* ---------- initial resize and rain density adapt ---------- */
window.addEventListener('resize', ()=>{ initRain(Math.floor(window.innerWidth/3)); });
initRain(Math.floor(window.innerWidth/3));

/* ---------- Accessibility: reduce motion if user prefers ---------- */
const mq = window.matchMedia('(prefers-reduced-motion: reduce)');
if(mq.matches){
  // reduce animations
  anime.running.forEach(a=>a.pause && a.pause());
  drops.forEach(d=>{ d.speed *= 0.6; });
}
</script>
</body>
</html>
